[project]
name = "burger-menu"
version = "0.1.0"
description = "Lokálny systém elektronického menu a príjmu objednávok pre burgráreň"
requires-python = ">=3.13"
dependencies = [
    "Django>=5.0,<5.2",
    "psycopg[binary]>=3.1",
    "channels>=4.0",
    "channels-redis>=4.2",
    "daphne>=4.1",
    "redis>=5.0",
    "Pillow>=10.0",
    "qrcode[pil]>=7.4",
    "python-decouple>=3.8",
    "gunicorn>=22.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "factory_boy>=3.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "django-stubs>=5.0",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["migrations", ".venv", "media", "static"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py", "*_tests.py"]
addopts = "-ra -q --reuse-db"

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
exclude = ["migrations"]

[tool.django-stubs]
django_settings_module = "config.settings.local"
