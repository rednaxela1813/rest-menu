upstream django {
    server django:8000;
}

# Cloudflare Tunnel reaches nginx over http but sets X-Forwarded-Proto: https.
# Trust that value when present; otherwise fall back to the real scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~.+"   $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name menu.local _;
    client_max_body_size 20M;

    # Static and media are served directly by Nginx (fast, offline-friendly).
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }
    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # WebSocket endpoints for Channels.
    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
